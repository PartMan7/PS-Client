name: Publish

on:
  push:
    branches: [main]
    paths:
      - package.json

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: release
        name: Check for version bump
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREV=$(git show HEAD~1:package.json 2>/dev/null | node -pe "JSON.parse(fs.readFileSync(0,'utf8')).version" || true)
          if [ "$VERSION" = "$PREV" ]; then
            echo "package.json version unchanged ($VERSION), skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Publishing $TAG (was v$PREV)."
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 18.x
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          registry-url: https://registry.npmjs.org

      - if: steps.release.outputs.publish == 'true'
        run: npm ci

      - if: steps.release.outputs.publish == 'true'
        run: npm test

      - name: Publish to npm
        if: steps.release.outputs.publish == 'true'
        run: npm publish --provenance --access public

      - name: Create and push tag
        if: steps.release.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"

      - name: Create GitHub release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
